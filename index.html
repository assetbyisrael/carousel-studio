<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carousel Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Asset by Israel Carousel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: editor column on the left, live 4:5 slide preview + swipe strip on the right; stacks on phones */
:root{
  color-scheme:dark;
  --navy:#0B1626; --navy2:#13233A; --panel:#101D31; --field:#0B1626; --slate:#1F343D;
  --orange:#FF7A1A; --ivory:#F4EFE6; --muted:#8C9DB1; --rule:rgba(244,239,230,.12); --danger:#E5484D;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{background:var(--navy);color:var(--ivory)}
body{font-family:var(--ui);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- app chrome ---------- */
.app-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between;max-width:1320px;margin:0 auto 18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .sq{width:16px;height:16px;background:var(--orange);transform:rotate(45deg)}
.brand h1{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:2px;margin:0;text-transform:uppercase}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.5px}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--rule);background:var(--navy2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:rgba(244,239,230,.3)}
.btn.primary{background:var(--orange);color:var(--navy);border-color:var(--orange)}
.btn.primary:hover{background:#ff8c38}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8f92}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select.btn{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}

.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;max-width:1320px;margin:0 auto;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.preview-col{order:-1}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:18px;min-width:0}
.panel h2{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}

/* slide tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{width:44px;height:55px;border-radius:8px;border:2px solid var(--rule);background:var(--navy);font-family:var(--display);font-size:18px;display:grid;place-items:center;position:relative}
.tab.ivory{background:var(--ivory);color:var(--navy)}
.tab.orange{background:var(--orange);color:var(--navy)}
.tab.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.tab.add{border-style:dashed;font-family:var(--ui);font-size:24px;color:var(--muted);background:transparent}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row-btns .btn{padding:7px 11px;font-size:13px}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:#C9D3DF}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--field);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.themes{display:flex;gap:8px}
.themes button{flex:1;border-radius:10px;border:2px solid var(--rule);padding:10px 6px;font-weight:700;font-size:13px}
.themes button[data-t="navy"]{background:var(--navy)}
.themes button[data-t="ivory"]{background:var(--ivory);color:var(--navy)}
.themes button[data-t="orange"]{background:var(--orange);color:var(--navy)}
.themes button.on{border-color:#fff;box-shadow:0 0 0 2px var(--orange)}
.tip{font-size:13px;color:var(--muted);background:rgba(255,122,26,.08);border:1px solid rgba(255,122,26,.25);border-radius:10px;padding:10px 12px}
.tip b{color:var(--orange)}
details.brandbox summary{cursor:pointer;font-weight:700;font-size:14px}
details.brandbox[open] summary{margin-bottom:12px}

/* preview */
.preview-col{position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:900px){.preview-col{position:static}}
.stage{width:100%;max-width:560px;margin:0 auto;aspect-ratio:4/5;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.stage .scaler{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0}
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;margin-top:8px;scroll-snap-type:x mandatory}
.mini{flex:none;width:108px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;position:relative;border:2px solid transparent;scroll-snap-align:start;padding:0;background:none}
.mini.on{border-color:var(--orange)}
.mini .scaler{position:absolute;left:0;top:0;width:1080px;height:1350px;transform:scale(.1);transform-origin:0 0;pointer-events:none}
.status{min-height:22px;text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
.status.err{color:#ff8f92}
.status.ok{color:#7FE0A8}

/* save fallback */
.sheet{position:fixed;inset:0;background:rgba(5,10,18,.86);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-inner{max-width:520px;width:100%;background:var(--panel);border-radius:16px;padding:18px;border:1px solid var(--rule);max-height:100%;overflow:auto}
.sheet-inner img{width:100%;border-radius:10px;display:block;margin:12px 0}
.sheet[hidden]{display:none}
#export{position:fixed;left:-30000px;top:0;width:1080px;height:1350px;pointer-events:none}

/* ================= SLIDE DESIGN (1080 x 1350) ================= */
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--navy);color:var(--ivory);display:flex;flex-direction:column;padding:72px 84px 64px;font-family:var(--ui);line-height:1.2;text-align:left}
.slide *{box-sizing:border-box}
.slide.ivory{background:var(--ivory);color:var(--navy)}
.slide.orange{background:var(--orange);color:var(--navy)}
.slide .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(244,239,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(244,239,230,.07) 1px,transparent 1px);background-size:54px 54px}
.slide.ivory .grid-bg{background-image:linear-gradient(rgba(11,22,38,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(11,22,38,.06) 1px,transparent 1px)}
.slide.orange .grid-bg{background-image:linear-gradient(rgba(11,22,38,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(11,22,38,.08) 1px,transparent 1px)}
.slide .glow{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(47,99,214,.38) 0%,rgba(47,99,214,.12) 40%,rgba(47,99,214,0) 68%)}
.slide .photo{position:absolute;inset:0;background-size:cover;background-position:center top}
.slide .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,22,38,1) 0%,rgba(11,22,38,.96) 38%,rgba(11,22,38,.35) 66%,rgba(11,22,38,.15) 100%)}
.slide .wm{position:absolute;left:-20px;bottom:170px;font-family:var(--display);font-size:330px;line-height:.85;white-space:nowrap;color:rgba(244,239,230,.045);text-transform:uppercase;letter-spacing:4px}
.slide.ivory .wm{color:rgba(11,22,38,.05)}
.slide .rail{position:absolute;left:0;right:0;bottom:150px;height:3px;background:var(--orange)}
.slide.orange .rail{background:var(--navy)}
.slide.first .rail{left:84px}.slide.last .rail{right:84px}
.slide .dot{position:absolute;bottom:144px;width:15px;height:15px;border-radius:50%;background:var(--orange)}
.slide.orange .dot{background:var(--navy)}
.slide .top{position:relative;display:flex;justify-content:space-between;align-items:center}
.slide .mark{display:flex;align-items:center;gap:16px}
.slide .mark i{width:22px;height:22px;background:var(--orange);transform:rotate(45deg);display:block}
.slide.orange .mark i{background:var(--navy)}
.slide .mark b{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:4px}
.slide .count{font-family:var(--display);font-size:28px;letter-spacing:3px;opacity:.55}
.slide .bottom{position:absolute;left:84px;right:84px;bottom:56px;display:flex;justify-content:space-between;align-items:center}
.slide .tagline{opacity:.55;letter-spacing:3px;text-transform:uppercase;font-size:20px;font-weight:500}
.slide .swipe{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:22px}
.slide .swipe svg{width:62px;height:20px}
.slide .body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:110px}
.slide.has-photo .body{justify-content:flex-end;padding-bottom:140px}
.slide .kicker{display:flex;align-items:center;gap:14px;font-weight:700;font-size:24px;letter-spacing:5px;text-transform:uppercase;color:var(--orange);margin-bottom:34px}
.slide .kicker:before{content:"";width:44px;height:3px;background:currentColor;display:block}
.slide.ivory .kicker{color:#D9600A}
.slide.orange .kicker{color:var(--navy)}
.slide .h{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.5px;margin:0}
.slide .xl{font-size:148px}.slide .l{font-size:118px}.slide .m{font-size:92px}.slide .s{font-size:72px}
.slide .o{color:var(--orange)}
.slide.ivory .o{color:#E8650C}
.slide.orange .o{color:var(--ivory)}
.slide .serif{font-family:var(--serif);font-style:italic;font-weight:600}
.slide .sub{font-size:54px;line-height:1.15;margin-top:34px}
.slide .lead{font-size:42px;line-height:1.38;font-weight:500;margin-top:34px;opacity:.92}
.slide .small{font-size:32px;line-height:1.45;opacity:.75;margin-top:44px}
.slide .hl{background:rgba(255,122,26,.45);padding:0 8px;border-radius:4px}
.slide .rows{display:flex;flex-direction:column;gap:24px;margin-top:44px}
.slide .rowi{display:flex;align-items:center;gap:30px;padding:26px 34px;border:2px solid rgba(244,239,230,.14);border-radius:20px;background:rgba(244,239,230,.03)}
.slide.ivory .rowi{border-color:rgba(11,22,38,.14);background:rgba(11,22,38,.03)}
.slide.orange .rowi{border-color:rgba(11,22,38,.25);background:rgba(11,22,38,.05)}
.slide .rowi .n{font-family:var(--display);font-size:64px;color:var(--orange);min-width:96px;line-height:1}
.slide.ivory .rowi .n{color:#E8650C}
.slide.orange .rowi .n{color:var(--navy)}
.slide .rowi .t{font-size:40px;font-weight:700;line-height:1.2}
.slide .chk{width:56px;height:56px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:none}
.slide.orange .chk{background:var(--navy)}
.slide .chk svg{width:30px;height:30px}
.slide .qmark{font-family:var(--serif);font-weight:600;font-size:380px;line-height:.62;color:var(--orange);height:170px}
.slide.orange .qmark{color:var(--navy)}
.slide .big{font-family:var(--display);font-size:250px;line-height:.9;color:var(--orange);white-space:nowrap}
.slide.ivory .big{color:#E8650C}
.slide.orange .big{color:var(--navy)}
.slide .quote{font-size:72px;line-height:1.15}
.slide table.cmp{width:100%;margin-top:48px;border-collapse:separate;border-spacing:0;border:2px solid rgba(244,239,230,.15);border-radius:22px;overflow:hidden}
.slide.ivory table.cmp{border-color:rgba(11,22,38,.15)}
.slide table.cmp th{text-align:left;padding:22px 32px;font-size:24px;letter-spacing:4px;font-weight:800;background:rgba(244,239,230,.06)}
.slide.ivory table.cmp th{background:rgba(11,22,38,.05)}
.slide table.cmp th:first-child{opacity:.6}
.slide table.cmp th:last-child{color:var(--orange)}
.slide table.cmp td{padding:26px 32px;font-size:36px;font-weight:600;border-top:2px solid rgba(244,239,230,.1);width:50%}
.slide.ivory table.cmp td{border-top-color:rgba(11,22,38,.1)}
.slide table.cmp td:first-child{opacity:.6}
.slide .card{background:var(--navy);color:var(--ivory);border-radius:28px;padding:46px 50px;margin-top:54px}
.slide .card .nm{font-family:var(--display);font-size:52px;letter-spacing:1px;text-transform:uppercase}
.slide .card .role{font-family:var(--serif);font-style:italic;font-weight:600;font-size:34px;color:var(--orange);margin-top:6px}
.slide .card .lines{display:flex;flex-wrap:wrap;margin-top:30px;font-size:30px;font-weight:600}
.slide .card .lines div{width:50%;display:flex;align-items:center;gap:14px;padding:9px 0}
.slide .card .lines svg{width:32px;height:32px;flex:none}
[hidden]{display:none!important}
html,body{margin:0}
body{padding-top:max(18px,env(safe-area-inset-top,0px))}
#gate{position:fixed;inset:0;z-index:100;background:var(--navy);display:grid;place-items:center;padding:24px}
#gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
#gate .sq{width:26px;height:26px;background:var(--orange);transform:rotate(45deg);margin:0 auto 10px}
#gate h1{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:2px;margin:0;text-transform:uppercase}
#gate input{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px;font-size:18px;text-align:center}
#gate .msg{min-height:20px;color:#ff8f92;font-size:14px}
</style>
</head><body>
<div id="gate" hidden><form id="gateForm"><div class="sq"></div><h1>Carousel Studio</h1><label for="pass" style="color:var(--muted)">Enter your passcode</label><input id="pass" type="password" autocomplete="current-password" autofocus><button class="btn primary" type="submit" style="justify-content:center">Open</button><div class="msg" id="gateMsg"></div></form></div>

<header class="app-head">
  <div class="brand"><div class="sq" aria-hidden="true"></div><div><h1>Carousel Studio</h1><small>Asset by Israel · 1080 × 1350 Instagram slides</small></div></div>
  <div class="head-actions">
    <label for="starter" class="visually-hidden" style="position:absolute;left:-9999px">Start from</label>
    <select id="starter" class="btn">
      <option value="">Start from…</option>
      <option value="cover">Single cover (for an old post)</option>
      <option value="blank">New 6-slide carousel</option>
      <option value="building">Example: Still Building</option>
      <option value="lagos">Example: Lagos Life</option>
      <option value="trust">Example: Trust</option>
    </select>
    <button class="btn" id="dlOne" type="button">Download this slide</button>
    <button class="btn primary" id="dlAll" type="button">Download all</button>
  </div>
</header>

<main class="grid">
  <section class="stack">
    <div class="panel">
      <h2>Slides</h2>
      <div class="tabs" id="tabs"></div>
      <div class="row-btns">
        <button class="btn" type="button" id="dup">Duplicate</button>
        <button class="btn" type="button" id="left">Move left</button>
        <button class="btn" type="button" id="right">Move right</button>
        <button class="btn danger" type="button" id="del">Delete</button>
      </div>
    </div>

    <div class="panel stack" id="form"></div>

    <div class="panel">
      <details class="brandbox">
        <summary>Contact details on the last slide</summary>
        <div class="stack">
          <div class="field"><label for="b_name">Name</label><input id="b_name"></div>
          <div class="field"><label for="b_role">Title line</label><input id="b_role"></div>
          <div class="two">
            <div class="field"><label for="b_ig">Instagram</label><input id="b_ig"></div>
            <div class="field"><label for="b_phone">Phone</label><input id="b_phone"></div>
          </div>
          <div class="two">
            <div class="field"><label for="b_web">Website</label><input id="b_web"></div>
            <div class="field"><label for="b_loc">Locations</label><input id="b_loc"></div>
          </div>
        </div>
      </details>
    </div>
  </section>

  <section class="preview-col">
    <div class="stage" id="stage"><div class="scaler" id="big"></div></div>
    <div class="strip" id="strip" aria-label="All slides"></div>
    <div class="status" id="status" role="status">Your work saves in this browser automatically.</div>
  </section>
</main>
<div id="export" aria-hidden="true"></div>
<div class="sheet" id="sheet" hidden><div class="sheet-inner"><strong>Press and hold each image, then choose “Save to Photos” (or right-click, “Save image as” on a computer).</strong><div id="sheetImgs"></div><button class="btn primary" type="button" id="sheetClose">Done</button></div></div>

<script>
const TYPES = {
  cover:     {label:"Cover: big headline", fields:["kicker","head","sub","wm","photo"]},
  quoteCover:{label:"Cover: quote", fields:["kicker","head","sub"]},
  stat:      {label:"Cover: big number", fields:["kicker","big","head","sub"]},
  statement: {label:"Statement", fields:["kicker","head","body"]},
  list:      {label:"List (numbered or ticks)", fields:["kicker","head","body","items","style"]},
  quote:     {label:"Big quote", fields:["head","sub"]},
  compare:   {label:"Two-column table", fields:["kicker","head","left","right","items"]},
  cta:       {label:"Closing slide (contact card)", fields:["kicker","head","sub"]},
};
const FIELD = {
  kicker:{label:"Small label above the headline",type:"input"},
  head:{label:"Headline",type:"textarea",hint:"Put *stars* around a word to make it orange."},
  sub:{label:"Italic line",type:"textarea",hint:"Put *stars* around a word to highlight it."},
  body:{label:"Body text",type:"textarea"},
  big:{label:"Big number or word",type:"input",hint:"Short works best, e.g. ₦3M or 10 YEARS."},
  wm:{label:"Faint background word (optional)",type:"input"},
  items:{label:"Items, one per line",type:"textarea",hint:"For the table, write each line as: left | right"},
  style:{label:"List style",type:"select",options:[["num","Numbers 01, 02, 03"],["check","Orange ticks"]]},
  left:{label:"Left column title",type:"input"},
  right:{label:"Right column title",type:"input"},
  photo:{label:"Photo (optional)",type:"file",hint:"A photo of you makes covers stop the scroll. Text sits at the bottom."},
};
const S = (type,theme,o)=>Object.assign({type,theme,kicker:"",head:"",sub:"",body:"",big:"",wm:"",items:"",style:"num",left:"",right:"",photo:""},o);
const PRESETS = {
  cover:()=>[S("cover","navy",{kicker:"Wealth mindset",head:"Earning money is not the same as building *wealth.*",sub:"It's what you do with what you earn.",wm:"WEALTH"})],
  blank:()=>[
    S("cover","navy",{kicker:"Topic",head:"Your big *hook* goes here.",sub:"One line that makes them swipe."}),
    S("statement","navy",{kicker:"The problem",head:"Say the *problem* plainly.",body:"Two or three short sentences that explain why this matters to the reader."}),
    S("list","navy",{kicker:"What to know",head:"Three *things*:",items:"First point\nSecond point\nThird point"}),
    S("list","ivory",{kicker:"Before you pay",head:"Check *these.*",items:"*WHAT* you are buying\n*WHERE* you are buying\n*WHO* you are buying from",style:"check"}),
    S("quote","navy",{head:"A line people will *screenshot* and share.",sub:"One supporting sentence."}),
    S("cta","orange",{kicker:"Let's talk",head:"Ready to start?",sub:"Send me a message today."})],
  building:()=>[
    S("cover","navy",{kicker:"Market note",head:"They say real estate is *dead.*",sub:"So why is everybody still building?",wm:"BUILD"}),
    S("list","navy",{kicker:"Look around",head:"Right now, in this *same* economy:",items:"Old buildings are coming down\nNew estates are going up\nCommercial sites are breaking ground",style:"check"}),
    S("list","navy",{kicker:"Follow the money",head:"Nobody puts *billions* into a trend.",body:"Serious money moves for three reasons:",items:"Demand they can see\nOpportunities they are acting on\nLong-term value they are chasing"}),
    S("list","ivory",{kicker:"But hold on",head:"Not every project is a *good* one.",body:"And not every developer deserves your money. Before you pay a kobo, know:",items:"*WHAT* you are buying\n*WHERE* you are buying\n*WHO* you are buying from",style:"check"}),
    S("quote","navy",{head:"While you are still wondering if it is worth it, someone else is already *positioning* for what comes next.",sub:"Don't let the noise blind you to the opportunity."}),
    S("cta","orange",{kicker:"Let's talk",head:"Not sure where to start?",sub:"That's a conversation I'd be happy to have."})],
  lagos:()=>[
    S("cover","navy",{kicker:"Real talk · Lagos Life",head:"Billionaire in the *game.*",sub:"But what does your real-life portfolio look like?",wm:"GAME"}),
    S("list","navy",{kicker:"Be honest",head:"In the game, you:",items:"Build houses\nBuy land\nCollect rent\nRun businesses",style:"check"}),
    S("statement","navy",{kicker:"Game mode → real mode",head:"Now, what if you brought that *energy* offline?"}),
    S("list","ivory",{kicker:"It's not either / or",head:"You can have *both.*",items:"Enjoy your money + build assets\nLive your life + own property that pays you",style:"check"}),
    S("compare","navy",{kicker:"Same rules apply",head:"The game already taught you the *playbook.*",left:"IN THE GAME",right:"IN REAL LIFE",items:"Buy land early | Buy verified land early\nBuild on it | Build or hold for value\nCollect rent | Earn real income\nGrow the empire | Grow a portfolio"}),
    S("cta","orange",{kicker:"Let's talk",head:"Ready to level up for real?",sub:"Let's build your real-life property portfolio."})],
  trust:()=>[
    S("quoteCover","navy",{kicker:"The question I respect most",head:"Israel, how do I know I can *trust* you with my money?",sub:"Let me answer that honestly."}),
    S("statement","navy",{kicker:"Fair question",head:"Buying property is a *big* decision.",body:"It's your hard-earned money. And sometimes, you're making the decision from another country."}),
    S("statement","navy",{kicker:"What you don't need",head:"You need more than a price and an *account number.*",body:"That's a transaction. You deserve a consultation."}),
    S("list","ivory",{kicker:"What you do need",head:"Someone who:",items:"Listens to you\nUnderstands what you're trying to achieve\nGives you the right information\nHelps you decide with confidence"}),
    S("statement","navy",{kicker:"What I've learned",head:"Nigeria. The diaspora. *Every* client is different.",body:"Some came with questions. Some needed clarity. Some wanted to be sure before committing a naira."}),
    S("cta","orange",{kicker:"Let's talk",head:"Ask me anything before you pay anything.",sub:"Your questions are welcome here."})],
};
const BRAND0 = {name:"Israel Toluwalope OLALEYE",role:"Your Favorite Real Estate Consultant.",ig:"@asset_by_israel",phone:"+234 903 349 9271",web:"assetbyisrael.com",loc:"Lagos · Ibadan · Ogun"};
const KEY="abi-carousel-studio-v1";
let state = {brand:{...BRAND0}, slides:PRESETS.building(), cur:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&Array.isArray(s.slides)&&s.slides.length){state={...state,...s,brand:{...BRAND0,...(s.brand||{})}};}}catch(e){}
state.cur=Math.min(state.cur||0,state.slides.length-1);

const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const orange=s=>esc(s).replace(/\*(.+?)\*/g,'<span class="o">$1</span>').replace(/\n/g,"<br>");
const hilite=s=>esc(s).replace(/\*(.+?)\*/g,'<span class="hl">$1</span>').replace(/\n/g,"<br>");
const ICON={
  check:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16l6 6 12-13"/></svg>',
  arrow:'<svg viewBox="0 0 62 20" fill="currentColor"><rect x="0" y="8.5" width="50" height="3"/><path d="M48 2l14 8-14 8z"/></svg>',
  ig:'<svg viewBox="0 0 32 32" fill="none" stroke="#FF7A1A" stroke-width="2.2"><rect x="5" y="5" width="22" height="22" rx="6"/><circle cx="16" cy="16" r="5"/></svg>',
  ph:'<svg viewBox="0 0 32 32" fill="none" stroke="#FF7A1A" stroke-width="2.2"><path d="M8 5h5l2 6-3 2c1.5 3 4 5.5 7 7l2-3 6 2v5c0 1-1 2-2 2C14 26 6 18 6 7c0-1 1-2 2-2z"/></svg>',
  web:'<svg viewBox="0 0 32 32" fill="none" stroke="#FF7A1A" stroke-width="2.2"><circle cx="16" cy="16" r="11"/><path d="M5 16h22M16 5c4 4 4 18 0 22M16 5c-4 4-4 18 0 22"/></svg>',
  pin:'<svg viewBox="0 0 32 32" fill="none" stroke="#FF7A1A" stroke-width="2.2"><path d="M16 29s9-8 9-15a9 9 0 0 0-18 0c0 7 9 15 9 15z"/><circle cx="16" cy="14" r="3"/></svg>',
};
const GLOWS=["left:-350px;top:-350px","right:-450px;bottom:-350px","left:-400px;bottom:-400px","right:-350px;top:-350px"];

function headSize(t,base){const n=(t||"").replace(/\*/g,"").length; const sizes=["xl","l","m","s"]; let i=sizes.indexOf(base); if(n>34&&i<1)i=1; if(n>56&&i<2)i=2; if(n>90)i=3; return sizes[i];}
function lines(s){return String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);}

function slideHTML(s,i,n){
  const b=state.brand, cls=["slide",s.theme==="navy"?"":s.theme]; if(i===0)cls.push("first"); if(i===n-1)cls.push("last");
  const hasPhoto=s.type==="cover"&&s.photo; if(hasPhoto)cls.push("has-photo");
  let bg='<div class="grid-bg"></div>';
  if(s.theme==="navy"&&!hasPhoto) bg+=`<div class="glow" style="${GLOWS[i%4]}"></div>`;
  if(hasPhoto) bg+=`<div class="photo" style="background-image:url('${s.photo}')"></div><div class="shade"></div>`;
  if(s.wm&&!hasPhoto) bg+=`<div class="wm">${esc(s.wm)}</div>`;
  bg+='<div class="rail"></div>'+(i===0?'<div class="dot" style="left:78px"></div>':'')+(i===n-1&&n>1?'<div class="dot" style="right:78px"></div>':'');
  const k=s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:"";
  let body="";
  switch(s.type){
    case "cover": body=`${k}<h2 class="h ${headSize(s.head,"xl")}">${orange(s.head)}</h2>${s.sub?`<div class="sub serif">${hilite(s.sub)}</div>`:""}`;break;
    case "quoteCover": body=`<div class="qmark">&ldquo;</div>${k?k.replace('kicker"','kicker" style="margin-top:20px"'):""}<h2 class="h ${headSize(s.head,"l")}">${orange(s.head)}</h2>${s.sub?`<div class="sub serif">${hilite(s.sub)}</div>`:""}`;break;
    case "stat": body=`${k}<div class="big">${esc(s.big)}</div><h2 class="h m" style="margin-top:20px">${orange(s.head)}</h2>${s.sub?`<div class="sub serif">${hilite(s.sub)}</div>`:""}`;break;
    case "statement": body=`${k}<h2 class="h ${headSize(s.head,"xl")}">${orange(s.head)}</h2>${s.body?`<p class="lead">${hilite(s.body)}</p>`:""}`;break;
    case "list": {const it=lines(s.items); body=`${k}<h2 class="h ${headSize(s.head,"l")}">${orange(s.head)}</h2>${s.body?`<p class="lead">${hilite(s.body)}</p>`:""}<div class="rows">${it.map((t,j)=>`<div class="rowi">${s.style==="check"?`<div class="chk" style="color:${s.theme==="orange"?"#FF7A1A":"#0B1626"}">${ICON.check}</div>`:`<div class="n">${String(j+1).padStart(2,"0")}</div>`}<div class="t">${orange(t)}</div></div>`).join("")}</div>`;break;}
    case "quote": body=`<div class="qmark">&ldquo;</div><div class="quote serif">${hilite(s.head)}</div>${s.sub?`<p class="small">${esc(s.sub)}</p>`:""}`;break;
    case "compare": {const it=lines(s.items).map(l=>l.split("|").map(x=>x.trim())); body=`${k}<h2 class="h m">${orange(s.head)}</h2><table class="cmp"><tr><th>${esc(s.left)}</th><th>${esc(s.right)}</th></tr>${it.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]||"")}</td></tr>`).join("")}</table>`;break;}
    case "cta": body=`${k}<h2 class="h ${headSize(s.head,"l")}">${orange(s.head)}</h2>${s.sub?`<div class="sub serif">${hilite(s.sub)}</div>`:""}
      <div class="card"><div class="nm">${esc(b.name)}</div><div class="role">${esc(b.role)}</div><div class="lines">
      <div>${ICON.ig}${esc(b.ig)}</div><div>${ICON.ph}${esc(b.phone)}</div><div>${ICON.web}${esc(b.web)}</div><div>${ICON.pin}${esc(b.loc)}</div></div></div>`;break;
  }
  const corner = n>1?`${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`:"";
  const right = (i<n-1||n===1)?`<div class="swipe">Swipe ${ICON.arrow}</div>`:`<div class="swipe">Save &amp; share</div>`;
  return `<div class="${cls.filter(Boolean).join(" ")}">${bg}
    <div class="top"><div class="mark"><i></i><b>ASSET BY ISRAEL</b></div><div class="count">${corner}</div></div>
    <div class="body">${body}</div>
    <div class="bottom"><div class="tagline">Invested · Intentional · Inevitable</div>${right}</div></div>`;
}

/* ---------- UI ---------- */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){try{localStorage.setItem(KEY,JSON.stringify({...state,slides:state.slides.map(s=>({...s,photo:""}))}));setStatus("Saved, but photos are too large to keep after you close this page.","");}catch(_){}}
}
function setStatus(t,c){const el=$("status");el.textContent=t;el.className="status "+(c||"");}
function fit(){const st=$("stage");$("big").style.transform=`scale(${st.clientWidth/1080})`;}

function renderPreview(){
  const n=state.slides.length;
  $("big").innerHTML=slideHTML(state.slides[state.cur],state.cur,n);
  $("strip").innerHTML=state.slides.map((s,i)=>`<button type="button" class="mini ${i===state.cur?"on":""}" data-i="${i}" aria-label="Slide ${i+1}"><div class="scaler">${slideHTML(s,i,n)}</div></button>`).join("");
  $("tabs").innerHTML=state.slides.map((s,i)=>`<button type="button" class="tab ${s.theme} ${i===state.cur?"on":""}" data-i="${i}" aria-label="Edit slide ${i+1}">${i+1}</button>`).join("")+`<button type="button" class="tab add" id="add" aria-label="Add slide">+</button>`;
  fit();
}
function renderForm(){
  const s=state.slides[state.cur];
  let h=`<h2>Slide ${state.cur+1}</h2>
  <div class="field"><label for="f_type">Layout</label><select id="f_type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===s.type?"selected":""}>${v.label}</option>`).join("")}</select></div>
  <div class="field"><span style="font-size:13px;font-weight:600;color:#C9D3DF">Background</span><div class="themes">${["navy","ivory","orange"].map(t=>`<button type="button" data-t="${t}" class="${s.theme===t?"on":""}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div>`;
  for(const f of TYPES[s.type].fields){
    const d=FIELD[f]; let lab=d.label; if(f==="head"&&s.type==="quote")lab="Quote";
    let input;
    if(d.type==="textarea") input=`<textarea id="f_${f}" rows="${f==="items"?5:3}">${esc(s[f])}</textarea>`;
    else if(d.type==="select") input=`<select id="f_${f}">${d.options.map(([v,l])=>`<option value="${v}" ${s[f]===v?"selected":""}>${l}</option>`).join("")}</select>`;
    else if(d.type==="file") input=`<input id="f_${f}" type="file" accept="image/*">${s.photo?`<button type="button" class="btn ghost" id="rmPhoto" style="align-self:flex-start">Remove photo</button>`:""}`;
    else input=`<input id="f_${f}" value="${esc(s[f])}">`;
    h+=`<div class="field"><label for="f_${f}">${lab}</label>${input}${d.hint?`<span class="hint">${d.hint}</span>`:""}</div>`;
  }
  h+=`<div class="tip">Tip: wrap a word in <b>*stars*</b> to make it orange, e.g. They say real estate is *dead.*</div>`;
  $("form").innerHTML=h;
  $("f_type").onchange=e=>{s.type=e.target.value;commit(true);};
  $("form").querySelectorAll(".themes button").forEach(b=>b.onclick=()=>{s.theme=b.dataset.t;commit(true);});
  for(const f of TYPES[s.type].fields){
    const el=$("f_"+f); if(!el)continue;
    if(FIELD[f].type==="file"){el.onchange=()=>{const file=el.files[0]; if(!file)return; downscale(file).then(url=>{s.photo=url;commit(true);});};continue;}
    el.oninput=el.onchange=()=>{s[f]=el.value;commit(false);};
  }
  const rm=$("rmPhoto"); if(rm)rm.onclick=()=>{s.photo="";commit(true);};
}
function downscale(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.86));};img.src=r.result;};r.readAsDataURL(file);});}
function commit(full){save();renderPreview();if(full)renderForm();}
function renderAll(){renderPreview();renderForm();
  for(const k of Object.keys(BRAND0)){const el=$("b_"+k);el.value=state.brand[k];el.oninput=()=>{state.brand[k]=el.value;save();renderPreview();};}}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-i]"); if(t&&(t.classList.contains("tab")||t.classList.contains("mini"))){state.cur=+t.dataset.i;save();renderPreview();renderForm();return;}
  if(e.target.closest("#add")){const s=S("statement","navy",{kicker:"New slide",head:"Write your *point* here."});state.slides.splice(state.cur+1,0,s);state.cur++;commit(true);}
});
$("dup").onclick=()=>{state.slides.splice(state.cur+1,0,JSON.parse(JSON.stringify(state.slides[state.cur])));state.cur++;commit(true);};
$("del").onclick=()=>{if(state.slides.length===1){setStatus("A post needs at least one slide.","err");return;}state.slides.splice(state.cur,1);state.cur=Math.max(0,state.cur-1);commit(true);};
$("left").onclick=()=>{const i=state.cur;if(i<1)return;[state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]];state.cur--;commit(true);};
$("right").onclick=()=>{const i=state.cur;if(i>=state.slides.length-1)return;[state.slides[i+1],state.slides[i]]=[state.slides[i],state.slides[i+1]];state.cur++;commit(true);};
$("starter").onchange=e=>{const v=e.target.value;if(!v)return;state.slides=PRESETS[v]();state.cur=0;e.target.value="";commit(true);setStatus("Loaded. Edit the text on the left; it replaces what you had.","");};
window.addEventListener("resize",fit);

/* ---------- export ---------- */
async function toBlob(i){
  const holder=$("export"); holder.innerHTML=slideHTML(state.slides[i],i,state.slides.length);
  await document.fonts.ready;
  const canvas=await html2canvas(holder.firstElementChild,{width:1080,height:1350,scale:1,backgroundColor:null,logging:false,useCORS:true});
  holder.innerHTML="";
  return await new Promise(r=>canvas.toBlob(r,"image/png"));
}
function slug(){const h=(state.slides[0].head||"slide").replace(/\*/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);return h||"carousel";}
const isTouch=matchMedia("(pointer:coarse)").matches;
async function shareFiles(files){
  if(isTouch&&navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files});setStatus("Done. Choose “Save Images” to put them in your gallery.","ok");return true;}catch(e){if(e&&e.name==="AbortError"){setStatus("Cancelled.","");return true;}}}
  return false;
}
function downloadBlob(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);setStatus("Downloaded "+name,"ok");}
function showSheet(blobs){$("sheetImgs").innerHTML="";blobs.forEach(b=>{const img=new Image();img.src=URL.createObjectURL(b);img.alt="Slide image";$("sheetImgs").appendChild(img);});$("sheet").hidden=false;}
$("sheetClose").onclick=()=>{$("sheet").hidden=true;};
$("dlOne").onclick=async()=>{const btn=$("dlOne");btn.disabled=true;setStatus("Preparing slide…","");
  try{const blob=await toBlob(state.cur);const name=`${slug()}-slide-${String(state.cur+1).padStart(2,"0")}.png`;const f=new File([blob],name,{type:"image/png"});if(!(await shareFiles([f]))){if(isTouch){showSheet([blob]);setStatus("","");}else downloadBlob(name,blob);}}
  catch(e){setStatus("Couldn't make the image. Try again in a moment.","err");}btn.disabled=false;};
$("dlAll").onclick=async()=>{const btn=$("dlAll");btn.disabled=true;
  try{const blobs=[];for(let i=0;i<state.slides.length;i++){setStatus(`Preparing slide ${i+1} of ${state.slides.length}…`,"");blobs.push(await toBlob(i));}
    const files=blobs.map((b,i)=>new File([b],`${slug()}-${String(i+1).padStart(2,"0")}.png`,{type:"image/png"}));
    if(await shareFiles(files)){}else if(isTouch){showSheet(blobs);setStatus("","");}
    else{const zip=new JSZip();files.forEach(f=>zip.file(f.name,f));downloadBlob(`${slug()}.zip`,await zip.generateAsync({type:"blob"}));}}
  catch(e){setStatus("Couldn't make the images. Try again in a moment.","err");}btn.disabled=false;};

renderAll();
document.fonts&&document.fonts.ready.then(fit);
/* passcode gate: keeps casual visitors out (not bank-grade security) */
const PASS_HASH="d10dd510c72ea24edc79d729e975698650cdab043a2372a9f5ac33bc0287e26c";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
let unlocked=false;try{unlocked=localStorage.getItem("abi-unlocked")===PASS_HASH;}catch(e){}
if(!unlocked)$("gate").hidden=false;
$("gateForm").onsubmit=async e=>{e.preventDefault();const v=$("pass").value.trim().toLowerCase();
  if(await sha(v)===PASS_HASH){try{localStorage.setItem("abi-unlocked",PASS_HASH);}catch(_){}$("gate").hidden=true;fit();}
  else $("gateMsg").textContent="That passcode isn't right. Try again.";};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
